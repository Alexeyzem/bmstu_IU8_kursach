<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 620 430' width='620' height='430'>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1f2937; font-size: 13px; }
.title { font-size: 18px; font-weight: 700; }
.subtitle { fill: #4b5563; font-size: 12px; }
.axis { stroke: #6b7280; stroke-width: 1; }
.grid { stroke: #e5e7eb; stroke-width: 1; }
.bar0 { fill: #2563eb; }
.bar1 { fill: #dc2626; }
.bar2 { fill: #059669; }
.bar3 { fill: #d97706; }
.line1 { fill: none; stroke: #2563eb; stroke-width: 2; }
.line2 { fill: none; stroke: #dc2626; stroke-width: 2; }
.line3 { fill: none; stroke: #059669; stroke-width: 2; }
.cell-good { fill: #d1fae5; }
.cell-bad { fill: #fee2e2; }
.cell-neutral { fill: #e0f2fe; }
</style>
<text class='title' x='20' y='34'>Gold confusion matrix</text>
<text class='subtitle' x='210' y='72'>Predicted class</text>
<text transform='translate(40 250) rotate(-90)' class='subtitle'>True class</text>
<text x='245' y='94'>safe</text><text x='385' y='94'>dangerous</text>
<text x='90' y='180'>safe</text><text x='72' y='330'>dangerous</text>
<rect class='cell-good' x='210' y='100' width='144' height='144' rx='8' opacity='0.402'/>
<text x='228' y='148'>True safe</text>
<text class='title' x='228' y='188'>478</text>
<rect class='cell-bad' x='360' y='100' width='144' height='144' rx='8' opacity='0.333'/>
<text x='378' y='148'>False alarm</text>
<text class='title' x='378' y='188'>259</text>
<rect class='cell-bad' x='210' y='250' width='144' height='144' rx='8' opacity='0.288'/>
<text x='228' y='298'>Missed dangerous</text>
<text class='title' x='228' y='338'>120</text>
<rect class='cell-good' x='360' y='250' width='144' height='144' rx='8' opacity='1.000'/>
<text x='378' y='298'>True dangerous</text>
<text class='title' x='378' y='338'>2 353</text>
</svg>
